#
# Static-only CI (no AWS credentials). Keep checks and pinned versions in
# lockstep with .pre-commit-config.yaml, see CONTRIBUTING.md.
#
# Jobs: discover (finds patterns, no edits needed for new ones), fmt,
# terraform-checks, tflint, cfn-lint, terraform-docs, markdown-links, checkov,
# skill-package, and ci-passed (the single required check).

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits the matrices used by the per-pattern jobs: Terraform roots
  # (excluding tf_modules, validated through the patterns that use them) and
  # CloudFormation templates.
  discover:
    name: Discover pattern directories
    runs-on: ubuntu-latest
    outputs:
      terraform_dirs: ${{ steps.find.outputs.terraform_dirs }}
      cfn_files: ${{ steps.find.outputs.cfn_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Terraform roots and CloudFormation templates
        id: find
        shell: bash
        run: |
          set -euo pipefail

          # Directories with at least one *.tf file.
          terraform_dirs="$(
            find patterns -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path '*/tf_modules/*' \
            | xargs -n1 dirname \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"

          # *.yaml / *.yml under any cloudformation/ directory.
          cfn_files="$(
            find patterns -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -path '*/cloudformation/*' \
              -not -path '*/.terraform/*' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"

          echo "Discovered Terraform roots:"
          echo "${terraform_dirs}" | jq -r '.[]'
          echo "Discovered CloudFormation templates:"
          echo "${cfn_files}" | jq -r '.[]'

          {
            echo "terraform_dirs=${terraform_dirs}"
            echo "cfn_files=${cfn_files}"
          } >> "$GITHUB_OUTPUT"

  # Repo-wide `terraform fmt -check`.
  fmt:
    name: "Terraform fmt (repo-wide)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt -check -recursive
        shell: bash
        run: |
          # Capture the exit code so each offending file can be annotated.
          set +e
          echo "::group::terraform fmt -check -recursive -diff"
          terraform fmt -check -recursive -diff -no-color
          status=$?
          echo "::endgroup::"
          if [ "${status}" -ne 0 ]; then
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              echo "::error file=${f},title=terraform fmt::[terraform fmt] ${f} is not canonically formatted. Run: terraform fmt ${f}"
            done < <(terraform fmt -check -recursive -list=true -no-color)
            echo "::error title=terraform fmt::[terraform fmt] FAILED (repo-wide). One or more *.tf files are not canonically formatted (see annotations above). Fix locally with: terraform fmt -recursive"
            exit 1
          fi

  # Per-pattern `init -backend=false` + `validate` (no state, no credentials;
  # also works for the EKS pattern's providers without a cluster).
  terraform-checks:
    name: "Terraform validate: ${{ matrix.dir }}"
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.terraform_dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform init (no backend, no credentials)
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set +e
          echo "::group::terraform init: ${{ matrix.dir }}"
          terraform init -backend=false -input=false -no-color
          status=$?
          echo "::endgroup::"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=terraform init::[terraform init] FAILED in ${{ matrix.dir }}"
            exit "${status}"
          fi

      - name: terraform validate
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set +e
          echo "::group::terraform validate: ${{ matrix.dir }}"
          terraform validate -no-color
          status=$?
          echo "::endgroup::"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=terraform validate::[terraform validate] FAILED in ${{ matrix.dir }}"
            exit "${status}"
          fi

  # Per-pattern tflint with the AWS ruleset in .tflint.hcl.
  tflint:
    name: "tflint: ${{ matrix.dir }}"
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.terraform_dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.53.0"

      - name: tflint --init (install AWS ruleset)
        shell: bash
        env:
          # Avoids GitHub API rate limits when downloading the ruleset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: tflint
        shell: bash
        run: |
          set +e
          echo "::group::tflint: ${{ matrix.dir }}"
          tflint \
            --config "${GITHUB_WORKSPACE}/.tflint.hcl" \
            --chdir "${{ matrix.dir }}" \
            --no-color
          status=$?
          echo "::endgroup::"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=tflint::[tflint] FAILED in ${{ matrix.dir }} (see findings above)"
            exit "${status}"
          fi

  # Per-template cfn-lint (handles AWS::LanguageExtensions). Same pin as
  # pre-commit; older specs reject newer properties these templates use (e.g.
  # the CIDR resource configuration and Tunnel VPC endpoint types).
  cfn-lint:
    name: "cfn-lint: ${{ matrix.file }}"
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.cfn_files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        shell: bash
        run: pip install "cfn-lint==1.57.2"

      - name: cfn-lint ${{ matrix.file }}
        shell: bash
        run: |
          set +e
          echo "::group::cfn-lint: ${{ matrix.file }}"
          cfn-lint "${{ matrix.file }}"
          status=$?
          echo "::endgroup::"
          if [ "${status}" -ne 0 ]; then
            echo "::error file=${{ matrix.file }},title=cfn-lint::[cfn-lint] FAILED for ${{ matrix.file }} (see findings above)"
            exit "${status}"
          fi

  # Fails if a generated README (any dir with a .header.md) is stale.
  terraform-docs:
    name: terraform-docs drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install terraform-docs
        shell: bash
        run: |
          set -euo pipefail
          version="v0.21.0"
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://terraform-docs.io/dl/${version}/terraform-docs-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          chmod +x /tmp/terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Check generated READMEs are up to date
        shell: bash
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/.config/.terraform-docs.yaml"
          fail=0
          while IFS= read -r header; do
            dir="$(dirname "${header}")"
            echo "::group::terraform-docs drift: ${dir}"
            if ! terraform-docs --config "${config}" --output-check "${dir}"; then
              echo "::error file=${dir}/README.md::Generated README is stale for ${dir}. Run: terraform-docs --config .config/.terraform-docs.yaml ${dir}"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find patterns -type f -name '.header.md' -not -path '*/.terraform/*' | sort)
          exit "${fail}"

  # Markdown link check; 206/429 accepted so external flakiness doesn't block PRs.
  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,429
            --exclude-path .terraform
            './**/*.md'
          fail: true
        env:
          # Raises GitHub link-check rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # IaC security scan driven by the .checkov.yaml baseline. Non-blocking
  # (soft_fail) until the baseline is fully triaged.
  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: patterns
          config_file: .checkov.yaml
          soft_fail: true
          # Hides PASSED checks; FAILED ones still show file and check ID.
          output_format: cli
          quiet: true

  # Skill package: frontmatter, paths, snapshot provenance, evals.
  skill-package:
    name: Agent skill package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skill package
        shell: bash
        run: python3 skills/vpc-lattice-blueprints/scripts/validate-package.py

  # Single gate for branch protection. Add every new top-level job to `needs`.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    # always(): evaluate results instead of being skipped when a job fails.
    if: always()
    needs:
      - discover
      - fmt
      - terraform-checks
      - tflint
      - cfn-lint
      - terraform-docs
      - markdown-links
      - checkov
      - skill-package
    steps:
      - name: Verify all required jobs succeeded
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for r in ${results}; do
            if [ "${r}" = "failure" ] || [ "${r}" = "cancelled" ]; then
              echo "::error title=CI passed::A required CI job did not pass (result: ${r}). See the failed job above."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
