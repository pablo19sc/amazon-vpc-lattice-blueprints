#
# Local pre-commit checks: the same static checks as .github/workflows/ci.yml.
# Keep both in lockstep (checks and pinned versions), see CONTRIBUTING.md.
#
#   pip install pre-commit && pre-commit install && pre-commit run --all-files
#
# Needs terraform, tflint, terraform-docs and lychee installed locally;
# cfn-lint and checkov are installed by pre-commit from the pinned revs.

minimum_pre_commit_version: "3.5.0"

repos:
  # Terraform: fmt, validate, tflint, terraform-docs drift (mirror the CI jobs).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt

      # Runs `init -backend=false` first: no state backend or AWS credentials.
      - id: terraform_validate

      # Shared repo ruleset (__GIT_WORKING_DIR__ = repo root).
      - id: terraform_tflint
        args:
          - "--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"

      # Generated READMEs must match .header.md + variables/outputs.
      - id: terraform_docs
        args:
          - "--args=--config=.config/.terraform-docs.yaml"

  # cfn-lint, same pin as CI. Older specs reject newer properties these templates
  # use (e.g. the CIDR resource configuration and Tunnel VPC endpoint types).
  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.57.2
    hooks:
      - id: cfn-lint
        files: ^patterns/.*/cloudformation/.*\.(yaml|yml)$

  # checkov: scope and frameworks come from .checkov.yaml, as in CI
  # (the default `-d .` entry is dropped on purpose).
  - repo: https://github.com/bridgecrewio/checkov
    rev: "3.2.530"
    hooks:
      - id: checkov
        entry: checkov
        args:
          - "--config-file"
          - ".checkov.yaml"
        files: (\.tf$|^patterns/.*/cloudformation/.*\.(yaml|yml)$)
        exclude: \.terraform/.*$

  # Markdown links with lychee, same leniency as CI (206/429 accepted).
  - repo: local
    hooks:
      - id: lychee
        name: Markdown link check (lychee)
        description: Check links in markdown files using lychee (mirrors CI). Requires lychee installed locally.
        entry: lychee
        language: system
        types: [markdown]
        exclude: \.terraform/.*$
        args:
          - "--no-progress"
          - "--max-retries"
          - "2"
          - "--accept"
          - "200,206,429"

  # Skill package: frontmatter, paths, snapshot provenance, evals.
  - repo: local
    hooks:
      - id: skill-package-validate
        name: Agent skill package validation
        description: Validate the vpc-lattice-blueprints skill package (frontmatter, paths, snapshot provenance, evals structure). Mirrors CI.
        entry: python3 skills/vpc-lattice-blueprints/scripts/validate-package.py
        language: system
        files: ^skills/vpc-lattice-blueprints/
        pass_filenames: false

  # General hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.terraform/.*$
      - id: trailing-whitespace
        exclude: \.terraform/.*$
      - id: check-merge-conflict

      # CloudFormation templates are excluded (the safe loader can't parse !Ref
      # and friends); cfn-lint validates them. Multi-document YAML is allowed.
      - id: check-yaml
        args:
          - "--allow-multiple-documents"
        exclude: ^patterns/.*/cloudformation/.*\.(yaml|yml)$
