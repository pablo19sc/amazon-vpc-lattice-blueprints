AWSTemplateFormatVersion: 2010-09-09
Description: Central VPC endpoints VPC, resource gateway and resource configurations (group and single consumption models)
Transform: 'AWS::LanguageExtensions'

Mappings:
  SubnetToIndex:
    RGWa:
      Index: 0
    RGWb:
      Index: 1
    Endpointsa:
      Index: 2
    Endpointsb:
      Index: 3

Resources:
  # ---------- VPC ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - endpoints-vpc
              - !Ref AWS::StackName

  Ipv6Cidr:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      AmazonProvidedIpv6CidrBlock: true
      VpcId: !Ref VPC

  # For::Each iteration: per subnet type (RGW, Endpoints) and AZ (2 AZs)
  # Resources to create: 4 subnets, 4 route tables, 4 route table associations - obtaining AZ affinity
  'Fn::ForEach::SubnetTypes':
    - SubnetType
    - [RGW, Endpoints]
    - '${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b]
          # Subnets
        - '${SubnetType}Subnet${AvailabilityZone}':
            DependsOn:
              - Ipv6Cidr
            Type: AWS::EC2::Subnet
            Properties:
              VpcId: !Ref VPC
              AvailabilityZone: !Sub ${AWS::Region}${AvailabilityZone}
              CidrBlock: !Select
                - !FindInMap [SubnetToIndex, !Sub "${SubnetType}${AvailabilityZone}", Index]
                - !Cidr
                  - !GetAtt VPC.CidrBlock
                  - 256
                  - 8
              Ipv6CidrBlock: !Select
                - !FindInMap [SubnetToIndex, !Sub "${SubnetType}${AvailabilityZone}", Index]
                - !Cidr
                  - !Select [0, !GetAtt VPC.Ipv6CidrBlocks]
                  - 256
                  - 64
              AssignIpv6AddressOnCreation: true
              Tags:
                - Key: Name
                  Value: !Join
                    - '-'
                    - - !Sub consumer-subnet-${SubnetType}-AZ${AvailabilityZone}
                      - !Ref AWS::StackName
          # Route Tables
          '${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Properties:
              VpcId: !Ref VPC
              Tags:
                - Key: Name
                  Value: !Join
                    - '-'
                    - - !Sub consumer-rt-${SubnetType}-AZ${AvailabilityZone}
                      - !Ref AWS::StackName
          # Route Table associations
          '${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
              RouteTableId: !Ref
                'Fn::Sub': '${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'

  # Security Group (Resource Gateway)
  RGWSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Resource Gateway Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub endpoints-vpc-resource-gateway-security-group-${AWS::StackName}

  RGWSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref RGWSecurityGroup
      Description: Allowing TCP egress traffic (local VPC)
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      CidrIp: 10.0.0.0/16

  # Security Group (VPC endpoints)
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Endpoints Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub endpoints-vpc-endpoint-security-group-${AWS::StackName}

  EndpointSecurityGroupIngressRGW:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      Description: Allowing HTTPS traffic from Resource Gateway
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref RGWSecurityGroup

  EndpointSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      Description: Allowing egress traffic (any within local VPC)
      IpProtocol: "-1"
      CidrIp: 10.0.0.0/16

  # ---------- RESOURCE GATEWAY ----------
  ResourceGateway:
    Type: AWS::VpcLattice::ResourceGateway
    Properties:
      IpAddressType: DUALSTACK
      Name: resource-gateway-endpoints
      ResourceConfigDnsResolution: IN_VPC
      SecurityGroupIds:
        - !Ref RGWSecurityGroup
      SubnetIds:
        - !Ref RGWSubneta
        - !Ref RGWSubnetb
      VpcIdentifier: !Ref VPC

  # ---------- RESOURCE CONFIGURATIONS: GROUP CONSUMPTION MODEL ----------
  # Resource configuration (group) - consumed in consumer_group.yaml
  ResourceConfigurationGroup:
    Type: AWS::VpcLattice::ResourceConfiguration
    Properties:
      Name: resource-config-group-vpcendpoints
      ResourceGatewayId: !Ref ResourceGateway
      PortRanges:
        - 443
      ProtocolType: TCP
      ResourceConfigurationType: GROUP
      GroupDomain: !Sub '${AWS::Region}.amazonaws.com'

  # CloudWatch Logs log group (group resource configuration - endpoints owner view)
  ResourceConfigurationGroupAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpclattice/${AWS::StackName}/resource-config-group'
      RetentionInDays: 7

  # Access log subscription (group resource configuration)
  ResourceConfigurationGroupAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    Properties:
      ResourceIdentifier: !GetAtt ResourceConfigurationGroup.Arn
      DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ResourceConfigurationGroupAccessLogs}'

  # ---------- RESOURCE CONFIGURATIONS: SINGLE CONSUMPTION MODEL ----------
  # CloudWatch Logs log group (single resource configurations - endpoints owner view)
  ResourceConfigurationSingleAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpclattice/${AWS::StackName}/resource-config-single'
      RetentionInDays: 7

  # ---------- VPC ENDPOINTS & RESOURCE CONFIGURATIONS ----------
  # For::Each iteration: per VPC endpoint type (ssm, ssmmessages, ec2messages, sts)
  # Resources to create (per endpoint): 1 VPC endpoint, 1 CHILD resource configuration (member of the group),
  # 1 SINGLE resource configuration (consumed in consumer_single.yaml)
  'Fn::ForEach::EndpointTypes':
    - EndpointType
    - [ssm, ssmmessages, ec2messages, sts]
    - '${EndpointType}Endpoint':
        Type: AWS::EC2::VPCEndpoint
        Properties:
          IpAddressType: 'ipv4'
          PrivateDnsEnabled: true
          SecurityGroupIds:
            - !Ref EndpointSecurityGroup
          ServiceName: !Sub 'com.amazonaws.${AWS::Region}.${EndpointType}'
          SubnetIds:
            - !Ref EndpointsSubneta
            - !Ref EndpointsSubnetb
          VpcEndpointType: 'Interface'
          VpcId: !Ref VPC
      # Resource configuration (child of the group)
      '${EndpointType}ResourceConfiguration':
        Type: AWS::VpcLattice::ResourceConfiguration
        Properties:
          Name: !Sub 'resource-config-${EndpointType}'
          ResourceConfigurationGroupId: !GetAtt ResourceConfigurationGroup.Id
          PortRanges:
            - 443
          CustomDomainName: !Sub '${EndpointType}.${AWS::Region}.amazonaws.com'
          ResourceConfigurationDefinition:
            DnsResource:
              DomainName: !Sub '${EndpointType}.${AWS::Region}.amazonaws.com'
              IpAddressType: IPV4
          ResourceConfigurationType: CHILD
      # Resource configuration (single)
      '${EndpointType}ResourceConfigurationSingle':
        Type: AWS::VpcLattice::ResourceConfiguration
        Properties:
          Name: !Sub 'rc-single-${EndpointType}'
          ResourceGatewayId: !Ref ResourceGateway
          PortRanges:
            - 443
          ProtocolType: TCP
          CustomDomainName: !Sub '${EndpointType}.${AWS::Region}.amazonaws.com'
          ResourceConfigurationDefinition:
            DnsResource:
              DomainName: !Sub '${EndpointType}.${AWS::Region}.amazonaws.com'
              IpAddressType: IPV4
          ResourceConfigurationType: SINGLE

  # Access log subscriptions (1 per single resource configuration, shared log group)
  # Chained with DependsOn: each subscription updates the CloudWatch Logs resource policy for log delivery,
  # and concurrent updates fail with OperationAbortedException.
  ssmResourceConfigurationSingleAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: ResourceConfigurationGroupAccessLogSubscription
    Properties:
      ResourceIdentifier: !GetAtt ssmResourceConfigurationSingle.Arn
      DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ResourceConfigurationSingleAccessLogs}'

  ssmmessagesResourceConfigurationSingleAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: ssmResourceConfigurationSingleAccessLogSubscription
    Properties:
      ResourceIdentifier: !GetAtt ssmmessagesResourceConfigurationSingle.Arn
      DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ResourceConfigurationSingleAccessLogs}'

  ec2messagesResourceConfigurationSingleAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: ssmmessagesResourceConfigurationSingleAccessLogSubscription
    Properties:
      ResourceIdentifier: !GetAtt ec2messagesResourceConfigurationSingle.Arn
      DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ResourceConfigurationSingleAccessLogs}'

  stsResourceConfigurationSingleAccessLogSubscription:
    Type: AWS::VpcLattice::AccessLogSubscription
    DependsOn: ec2messagesResourceConfigurationSingleAccessLogSubscription
    Properties:
      ResourceIdentifier: !GetAtt stsResourceConfigurationSingle.Arn
      DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ResourceConfigurationSingleAccessLogs}'

Outputs:
  ResourceConfigurationGroup:
    Description: Group resource configuration ID (associate this to the group service network)
    Value: !GetAtt ResourceConfigurationGroup.Id
  ResourceConfigurationsSingle:
    Description: Single resource configuration IDs, comma-separated (associate each to the single service network)
    Value: !Join
      - ','
      - - !GetAtt ssmResourceConfigurationSingle.Id
        - !GetAtt ssmmessagesResourceConfigurationSingle.Id
        - !GetAtt ec2messagesResourceConfigurationSingle.Id
        - !GetAtt stsResourceConfigurationSingle.Id
