AWSTemplateFormatVersion: 2010-09-09
Description: Common items used by both consumption models (EC2 instance IAM role and instance profile)

Resources:
  # ---------- IAM ROLE (EC2 INSTANCES) ----------
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ec2-ssm-role-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: '1'
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Path: /

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'ec2-instance-profile-${AWS::StackName}'
      Roles:
        - !Ref EC2InstanceRole

Outputs:
  InstanceProfile:
    Description: EC2 instance profile name (used by the consumer instances of both consumption models)
    Value: !Ref EC2InstanceProfile
